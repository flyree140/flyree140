<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />
    <title>偲菱的關西之旅 - 終極突破版</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        body, html { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; overflow: hidden; }
        #app { display: flex; height: 100vh; flex-direction: column; }
        
        @media (min-width: 768px) { #app { flex-direction: row; } }
        
        #sidebar { 
            width: 100%; height: 45vh; overflow-y: auto; background-color: #ffffff; 
            padding: 20px; border-right: 1px solid #ddd; display: flex; flex-direction: column; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.05); z-index: 1000;
        }
        @media (min-width: 768px) { #sidebar { width: 420px; height: 100vh; } }
        
        #map { flex-grow: 1; height: 55vh; z-index: 1; }
        @media (min-width: 768px) { #map { height: 100vh; } }
        
        /* 側邊欄卡片樣式 */
        .place-card { 
            background: #fff; margin-bottom: 12px; border-radius: 10px; border: 1px solid #e9ecef; 
            border-left: 6px solid #ccc; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.04); 
            overflow: hidden; position: relative;
        }
        .place-card:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .place-card.is-excluded { opacity: 0.5; filter: grayscale(80%); border-left-color: #adb5bd !important; }
        
        .card-img-container { width: 110px; height: 100px; flex-shrink: 0; background: #f1f3f5; display: flex; align-items: center; justify-content: center; border-right: 1px solid #eee; }
        .card-img-container img { width: 100%; height: 100%; object-fit: cover; }
        .place-title { font-weight: bold; font-size: 1.05rem; color: #333; margin-bottom: 4px; padding-right: 35px;}
        
        /* 側邊欄操作按鈕 */
        .card-actions { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .action-btn { font-size: 1.2rem; cursor: pointer; padding: 2px 5px; transition: transform 0.2s; border-radius: 4px; background: rgba(255,255,255,0.8); }
        .action-btn:hover { transform: scale(1.15); }

        .control-panel { margin-bottom: 15px; position: sticky; top: 0; background: white; padding-bottom: 10px; z-index: 10; border-bottom: 1px solid #eee;}

        #loader { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.95); padding: 15px 30px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 2000; font-weight: bold; color: #0d6efd; border: 1px solid #cce5ff;}
        .leaflet-routing-container { display: none !important; }

        /* 地圖乾淨的小圓點標記 */
        .custom-icon { background: none; border: none; }
        .marker-circle {
            width: 26px; height: 26px; border-radius: 50%; border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4); display: flex; align-items: center;
            justify-content: center; color: white; font-weight: bold; font-size: 12px;
            transition: transform 0.2s;
        }
        .marker-circle.marker-excluded { background-color: #adb5bd !important; color: #fff; }
        .marker-circle:hover { transform: scale(1.2); z-index: 1000 !important; }

        /* 支援多圖左右滑動的彈出卡片 */
        .leaflet-popup-content-wrapper { border-radius: 8px; padding: 0; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2);}
        .leaflet-popup-content { margin: 0; width: 280px !important;}
        .gm-popup-img-box {
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory; 
            height: 180px; background-color: #000; scrollbar-width: none; /* Firefox */
        }
        .gm-popup-img-box::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
        .gm-popup-img-item { flex: 0 0 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; }
        .gm-popup-img-item img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .gm-popup-info { padding: 12px 15px 15px 15px; }
        .gm-popup-title { font-size: 16px; font-weight: bold; color: #202124; margin-bottom: 8px; }
        .gm-popup-note { font-size: 13px; color: #5f6368; line-height: 1.5; white-space: pre-wrap; margin: 0;}
        .leaflet-popup-close-button { color: #fff !important; text-shadow: 0 1px 3px rgba(0,0,0,0.8); right: 5px !important; top: 5px !important; font-size: 20px !important;}
    </style>
</head>
<body>

<div id="app">
    <!-- 左側面板 -->
    <div id="sidebar">
        <h4 class="mb-3 text-dark fw-bold">🗺️ 偲菱的關西之旅</h4>
        <div class="control-panel">
            <label class="form-label mb-1 text-secondary fw-bold" style="font-size: 0.85rem;">1. 選擇旅遊區域：</label>
            <select id="day-select" class="form-select mb-3 shadow-sm border-primary">
                <option value="All">顯示所有景點</option>
            </select>
            
            <div id="start-panel" style="display: none;">
                <label class="form-label mb-1 text-secondary fw-bold" style="font-size: 0.85rem;">2. 選擇你要從哪裡開始 (已過濾排除景點)：</label>
                <select id="start-select" class="form-select mb-3 shadow-sm border-primary"></select>
                
                <button id="btn-route" class="btn btn-primary w-100 mb-2 fw-bold shadow-sm py-2">🚶 自動規劃走路路線 (不含排除)</button>
                <button id="btn-nav" class="btn btn-success w-100 fw-bold shadow-sm py-2" style="display: none;">📱 傳送至 Google Maps 導航</button>
            </div>
            
            <div id="route-warning" class="text-danger mt-2" style="font-size: 0.8rem; display:none; background: #fff3f3; padding: 8px; border-radius: 5px; border: 1px solid #ffc107;">
                ⚠️ 提示：部分景點跨距過遠，系統已自動轉為虛線連接。
            </div>
        </div>
        <div id="place-list" class="pb-4"></div>
    </div>

    <!-- 右側地圖 -->
    <div id="map"></div>
    <div id="loader"><i class="bi bi-arrow-repeat spin"></i> 努力畫出最順街道中...</div>
</div>

<!-- 編輯視窗 Modal (支援多圖預覽) -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-light">
        <h5 class="modal-title fw-bold text-primary"><i class="bi bi-images"></i> 編輯景點與圖片</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-index">
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">景點名稱</label>
            <input type="text" class="form-control bg-white" id="edit-name" disabled>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">我的備註</label>
            <textarea class="form-control border-primary" id="edit-note" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">上傳照片 (可複選多張)</label>
            <input class="form-control" type="file" id="edit-image" accept="image/*" multiple>
            <div id="preview-container" class="mt-3" style="display:none; background: #f8f9fa; padding: 10px; border-radius: 8px; overflow-x: auto; white-space: nowrap;">
                <!-- 預覽圖片放這裡 -->
            </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-primary fw-bold" onclick="saveEdits()">💾 儲存修改</button>
      </div>
    </div>
  </div>
</div>

    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; 
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    async function drawSegmentedRealRoute(points, reqId) {
        document.getElementById('loader').style.display = 'block';
        document.getElementById('route-warning').style.display = 'none';
        
        let hasError = false;
        let chunkSize = 15; 
        let waypoints = points.map(p => `${p.lng},${p.lat}`);
        
        for (let i = 0; i < waypoints.length - 1; i += (chunkSize - 1)) {
            if (reqId !== routeRequestId) break;

            let chunk = waypoints.slice(i, i + chunkSize);
            let coords = chunk.join(';');
            
            try {
                let res = await fetch(`https://router.project-osrm.org/route/v1/foot/${coords}?overview=full&geometries=geojson`);
                let data = await res.json();
                
                if (reqId !== routeRequestId) break;
                
                if (data.code === 'Ok') {
                    let routeGeoJSON = data.routes[0].geometry;
                    let layer = L.geoJSON(routeGeoJSON, {
                        style: { color: '#0d6efd', weight: 6, opacity: 0.8 }
                    }).addTo(map);
                    routeLayers.push(layer);
                } else {
                    drawFallbackLine(points.slice(i, i + chunkSize));
                    hasError = true;
                }
            } catch (err) {
                if (reqId !== routeRequestId) break;
                drawFallbackLine(points.slice(i, i + chunkSize));
                hasError = true;
            }
        }
        
        if (reqId === routeRequestId) {
            document.getElementById('loader').style.display = 'none';
            if (hasError) document.getElementById('route-warning').style.display = 'block';
        }
    }

    function drawFallbackLine(pointsChunk) {
        let latlngs = pointsChunk.map(p => [p.lat, p.lng]);
        let line = L.polyline(latlngs, {color: '#dc3545', weight: 5, dashArray: '10, 10', opacity: 0.8}).addTo(map);
        routeLayers.push(line);

    // ★ 變更：Open TSP 開放式路線演算 (徹底解決終點交叉問題) ★
    document.getElementById('btn-route').addEventListener('click', async () => {
        routeRequestId++;
        const currentReqId = routeRequestId;

        const val = document.getElementById('day-select').value;
        const startName = document.getElementById('start-select').value;
        
        // 排除掉不參與規劃的景點
        let currentPlaces = places.filter(p => p.day === val && !p.excluded);
        if(currentPlaces.length < 2) return alert("可規劃的景點數量少於2個！");

        let startIndex = currentPlaces.findIndex(p => p.name === startName);
        let unvisited = [...currentPlaces];
        let current = unvisited.splice(startIndex, 1)[0]; 
        let route = [current];

        // 階段一：最近鄰居法 (Nearest Neighbor)
        while(unvisited.length > 0) {
            let nearestIdx = -1;
            let minDist = Infinity;
            for(let i = 0; i < unvisited.length; i++) {
                let d = getDistance(current.lat, current.lng, unvisited[i].lat, unvisited[i].lng);
                if(d < minDist) { minDist = d; nearestIdx = i; }
            }
            current = unvisited.splice(nearestIdx, 1)[0];
            route.push(current);
        }

        // 階段二：端點自由的 2-Opt 最佳化演算法 (解開死結)
        let improved = true;
        while(improved) {
            improved = false;
            for (let i = 1; i < route.length - 1; i++) {
                for (let j = i + 1; j < route.length; j++) {
                    if (j === route.length - 1) {
                        // 當涉及終點時，允許路線任意更換終止點
                        let d1 = getDistance(route[i-1].lat, route[i-1].lng, route[i].lat, route[i].lng);
                        let d2 = getDistance(route[i-1].lat, route[i-1].lng, route[j].lat, route[j].lng);
                        if (d2 < d1) {
                            let reversed = route.slice(i, j + 1).reverse();
                            route.splice(i, reversed.length, ...reversed);
                            improved = true;
                        }
                    } else {
                        // 處理一般中段路線的交叉
                        let d1 = getDistance(route[i-1].lat, route[i-1].lng, route[i].lat, route[i].lng)
                               + getDistance(route[j].lat, route[j].lng, route[j+1].lat, route[j+1].lng);
                        let d2 = getDistance(route[i-1].lat, route[i-1].lng, route[j].lat, route[j].lng)
                               + getDistance(route[i].lat, route[i].lng, route[j+1].lat, route[j+1].lng);
                        if (d2 < d1) {
                            let reversed = route.slice(i, j + 1).reverse();
                            route.splice(i, reversed.length, ...reversed);
                            improved = true;
                        }
                    }
                }
            }
        }

        currentOptimizedRoute = route;

        clearMap();
        renderMap(route, true);
        renderList(route, true);
        
        await drawSegmentedRealRoute(route, currentReqId);
        
        if(currentReqId === routeRequestId) {
            document.getElementById('btn-nav').style.display = 'block';
        }
    });

    document.getElementById('btn-nav').addEventListener('click', () => {
        if(currentOptimizedRoute.length === 0) return;
        let origin = `${currentOptimizedRoute[0].lat},${currentOptimizedRoute[0].lng}`;
        let dest = `${currentOptimizedRoute[currentOptimizedRoute.length-1].lat},${currentOptimizedRoute[currentOptimizedRoute.length-1].lng}`;
        
        let url = `https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=${origin}&destination=${dest}`;
        
        if (currentOptimizedRoute.length > 2) {
            let waypoints = currentOptimizedRoute.slice(1, -1).slice(0, 9).map(p => `${p.lat},${p.lng}`).join('|');
            url += `&waypoints=${waypoints}`;
        }
        window.open(url, '_blank');
    });

    // 編輯功能 (支援多圖片上傳)
    let editModal = new bootstrap.Modal(document.getElementById('editModal'));
    let pendingImages = [];
    
    function openEditModal(index, event) {
        event.stopPropagation();
        let place = places[index];
        document.getElementById('edit-index').value = index;
        document.getElementById('edit-name').value = place.name;
        document.getElementById('edit-note').value = place.note;
        
        let previewContainer = document.getElementById('preview-container');
        previewContainer.innerHTML = '';
        pendingImages = [];
        document.getElementById('edit-image').value = ""; 

        let displayImgs = place.customImgs && place.customImgs.length > 0 ? place.customImgs : place.imgs;
        
        if (displayImgs.length > 0) {
            displayImgs.forEach(url => {
                let imgEl = document.createElement('img');
                imgEl.src = getProxiedImageUrl(url);
                imgEl.style.cssText = "max-height: 120px; border-radius: 6px; margin-right: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);";
                previewContainer.appendChild(imgEl);
            });
            previewContainer.style.display = 'block';
        } else {
            previewContainer.style.display = 'none';
        }

        editModal.show();
    }

    document.getElementById('edit-image').addEventListener('change', function(e) {
        pendingImages = [];
        let files = e.target.files;
        let previewContainer = document.getElementById('preview-container');
        previewContainer.innerHTML = '';
        
        if(files.length === 0) {
            previewContainer.style.display = 'none';
            return;
        }
        previewContainer.style.display = 'block';
        
        Array.from(files).forEach(file => {
            let reader = new FileReader();
            reader.onload = function(event) {
                let img = new Image();
                img.onload = function() {
                    let canvas = document.createElement('canvas');
                    let maxWidth = 400; 
                    let scale = Math.min(1, maxWidth / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    let ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    let base64 = canvas.toDataURL('image/jpeg', 0.7);
                    pendingImages.push(base64);
                    
                    let previewImg = document.createElement('img');
                    previewImg.src = base64;
                    previewImg.style.cssText = "max-height: 120px; border-radius: 6px; margin-right: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);";
                    previewContainer.appendChild(previewImg);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });
    });

    function saveEdits() {
        let index = document.getElementById('edit-index').value;
        let newNote = document.getElementById('edit-note').value;
        
        places[index].note = newNote;
        if (pendingImages.length > 0) {
            places[index].customImgs = pendingImages; 
        }
        
        syncToLocal();
        editModal.hide();
        
        let val = document.getElementById('day-select').value;
        let filtered = val === "All" ? places : places.filter(p => p.day === val);
        
        // 若有正在規劃的路線，會直接清除路線並顯示新狀態 (避免資料錯亂)
        if(currentOptimizedRoute.length > 0) {
            currentOptimizedRoute = [];
            routeRequestId++; 
            document.getElementById('btn-nav').style.display = 'none';
        }
        
        renderList(filtered, false);
        clearMap();
        renderMap(filtered, false);
    }

    // 初始載入
    renderList(places, false);
    renderMap(places, false);
    map.setView([34.63, 135.40], 10); 

</script>
</body>
</html>
